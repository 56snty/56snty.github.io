name: Deploy to GitHub Pages

# The site is now a Vite build, so Pages can no longer serve the repo
# root directly. This builds dist/ and publishes that instead.
#
# One-time setup after merging: repository Settings → Pages →
# "Build and deployment" → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # CNAME is copied into dist/ by a plugin in vite.config.js.
      # Without it the emal.dev custom domain drops on every deploy.
      - name: Verify CNAME survived the build
        run: |
          test -f dist/CNAME || { echo "::error::dist/CNAME missing — custom domain would break"; exit 1; }
          echo "CNAME: $(cat dist/CNAME)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

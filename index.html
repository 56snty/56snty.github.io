<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="description" content="lowkey — ink. a wordmark suspended in fluid, synced to eindhoven.">
<title>lowkey — ink</title>

<!-- fonts: Space Grotesk (wordmark — has true lowercase; Bebas is caps-only and would break the lowercase brand), Space Mono (HUD) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0C0A08;
    --ink:#ECE7DE;
    --amber:#F0A030;
    --hud:rgba(236,231,222,.55);
    --hud-dim:rgba(236,231,222,.30);
  }
  body.light{
    --bg:#E9E4DB;
    --ink:#17120C;
    --amber:#B8641A;
    --hud:rgba(23,18,12,.60);
    --hud-dim:rgba(23,18,12,.34);
  }
  #themeBtn,#soundBtn{pointer-events:auto;cursor:pointer;user-select:none;-webkit-user-select:none}
  #themeBtn:hover,#soundBtn:hover{color:var(--ink)}
  #soundBtn.on{color:var(--amber)}
  .srcvid{position:fixed;left:-20px;top:-20px;width:2px;height:2px;opacity:0;pointer-events:none}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
  body{font-family:"Space Mono",monospace;color:var(--hud);-webkit-font-smoothing:antialiased}

  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:none}
  @media (pointer:coarse){ #c{cursor:default} }

  /* ---- HUD ------------------------------------------------------------ */
  .hud{position:fixed;z-index:3;font-size:10px;letter-spacing:.08em;line-height:1.7;
       pointer-events:none;opacity:0;transition:opacity 1.2s ease .3s;text-transform:lowercase;
       text-shadow:0 0 10px rgba(12,10,8,.60),0 1px 2px rgba(12,10,8,.45)}
  body.light .hud{text-shadow:0 0 10px rgba(233,228,219,.65),0 1px 2px rgba(233,228,219,.50)}
  body.ready .hud{opacity:1}
  .hud b{font-weight:700;color:var(--ink)}
  .hud .a{color:var(--amber)}
  .tl{top:max(18px,env(safe-area-inset-top));left:max(20px,env(safe-area-inset-left))}
  .tr{top:max(18px,env(safe-area-inset-top));right:max(20px,env(safe-area-inset-right));text-align:right}
  .bl{bottom:max(18px,env(safe-area-inset-bottom));left:max(20px,env(safe-area-inset-left))}
  .br{bottom:max(18px,env(safe-area-inset-bottom));right:max(20px,env(safe-area-inset-right));text-align:right}
  .tick{display:inline-block;width:7px;height:7px;background:var(--amber);margin-right:8px;transform:translateY(.5px)}
  #hint{transition:opacity 1s ease}
  body.touched #hint{opacity:0}
  .dim{color:var(--hud-dim)}

  /* ---- cursor ---------------------------------------------------------- */
  #cursor{position:fixed;z-index:4;width:14px;height:14px;border:1px solid var(--amber);border-radius:50%;
          top:0;left:0;pointer-events:none;transform:translate(-50%,-50%);opacity:0;
          transition:opacity .4s ease, width .18s ease, height .18s ease}
  body.ready #cursor{opacity:.9}
  body.down #cursor{width:8px;height:8px}
  @media (pointer:coarse){ #cursor{display:none} }

  /* ---- errors ----------------------------------------------------------- */
  #err{position:fixed;z-index:9;left:50%;top:50%;transform:translate(-50%,-50%);
       max-width:min(80vw,560px);font-size:11px;line-height:1.8;color:#d96a5a;
       white-space:pre-wrap;display:none}
</style>

<body>

<canvas id="c" role="img" aria-label="lowkey — interactive ink wordmark. drag to disperse; it reforms."></canvas>

<div class="hud tl"><span class="tick"></span><b>emal.dev</b> — ink<br><span class="dim">01 / signature · <span id="bgstat">bg · —</span></span></div>
<div class="hud tr"><span id="hint">drag to disperse<br><span class="dim">it reforms on its own</span></span><br><span id="themeBtn" class="dim">[ light ]</span> <span id="soundBtn" class="dim" style="display:none">[ sound ]</span></div>
<div class="hud bl"><span id="wx" class="dim">syncing eindhoven…</span><br>51.44°n — 5.47°e</div>
<div class="hud br"><b id="clock">--:--:--</b><br><span class="dim">eindhoven, nl</span></div>

<div id="cursor"></div>
<div id="err"></div>

<script>
"use strict";
/* =============================================================================
   lowkey — ink
   A GPGPU Navier–Stokes fluid written from scratch (no libraries).
   The wordmark exists as ink in the velocity field: pointer input disperses it,
   a restoration term pulls the dye back toward the word. Live Eindhoven weather
   (Open-Meteo) drives ambient wind, rain droplets and ink warmth.
   Passes/frame: curl → vorticity → ambient forces → divergence → pressure
   (Jacobi) → gradient subtract → advect velocity → advect dye → restore → post.
============================================================================= */

const CFG = {
  TEXT: "lowkey",
  FONT: '700 SIZEpx "Space Grotesk", sans-serif', // SIZE is replaced at build
  WORD_WIDTH: 0.80,        // max fraction of viewport width the word may span

  SIM_RES: 176,            // velocity/pressure grid (short side)
  DYE_RES: 1024,           // ink grid (short side)
  PRESSURE_ITERS: 20,
  VEL_DISSIPATION: 0.28,   // /s
  DYE_DISSIPATION: 0.55,   // /s — smears fade faster than letters refill
  RESTORE: 0.0060,         // pull toward wordmark, per frame @60fps
  RESTORE_INTRO: 0.035,
  CURL: 25,
  SPLAT_FORCE: 6000,
  SPLAT_RADIUS: 0.0022,

  DRIFT: 1.2,              // idle curl-noise amplitude
  WIND_MAX: 2.5,           // ambient force at >=50 km/h
  LAT: 51.44, LON: 5.47,   // eindhoven
  WEATHER: true,
  TZ: "Europe/Amsterdam",

  /* background videos — same filenames as the live site, drop-in.
     If a file is missing (or autoplay is blocked) the shader falls back
     to a procedural haze, never flat black. */
  VIDEO: { dark: "bg.mp4", light: "bg-light.mp4" },
  VIDEO_MIX: 0.92,     // how much video vs. base tone
  REFRACT: 0.00038,    // fluid velocity → background warp strength
  PARALLAX: 0.014,     // pointer micro-parallax on the video
  CHROMA: 1.22,        // chromatic spread of the warp (1 = off)
  AUDIO: "music.mp3",  // optional — [ sound ] toggle appears only if it loads

  THEMES: {
    dark: {                                   // night ride
      BG:[0.047,0.039,0.031], INK:[0.925,0.906,0.871], AMBER:[0.941,0.627,0.188],
      GAIN:0.90, SAT:0.82, GAMMA:1.08,        // grade: sink it, tame the greens
      EDGE:0.55, VIGNETTE:0.50,
      FOCUS_Y:0.42,   // vertical crop focus (y-up) — keeps the light band on widescreen
    },
    light: {                                  // the 918
      BG:[0.914,0.894,0.859], INK:[0.090,0.071,0.047], AMBER:[0.722,0.392,0.102],
      GAIN:1.00, SAT:0.92, GAMMA:0.98,
      EDGE:0.35, VIGNETTE:0.26,
      FOCUS_Y:0.50,
    },
  },
};

const MOBILE = matchMedia("(pointer: coarse)").matches;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (MOBILE) { CFG.SIM_RES = 144; CFG.DYE_RES = 768; CFG.PRESSURE_ITERS = 16; }
if (REDUCED){ CFG.DRIFT = 0.5; }

const canvas = document.getElementById("c");
const errBox = document.getElementById("err");
function fail(msg){ errBox.textContent = msg; errBox.style.display = "block"; throw new Error(msg); }

/* ---- GL context ---------------------------------------------------------- */
const gl = canvas.getContext("webgl2", { alpha:false, depth:false, stencil:false, antialias:false,
                                         powerPreference:"high-performance" });
if (!gl) fail("webgl2 required — this piece runs on the gpu.");
const extF  = gl.getExtension("EXT_color_buffer_float");
const extHF = gl.getExtension("EXT_color_buffer_half_float");
if (!extF && !extHF) fail("float render targets unsupported on this gpu.");
gl.getExtension("OES_texture_float_linear");
gl.disable(gl.BLEND);

/* ---- shaders -------------------------------------------------------------- */
const VERT = `#version 300 es
precision highp float;
in vec2 aPos; out vec2 vUv;
void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;

const FRAG_ADVECT = `#version 300 es
precision highp float; precision highp sampler2D;
in vec2 vUv; out vec4 o;
uniform sampler2D uVelocity, uSource;
uniform vec2 uTexel;       // velocity texel size
uniform float uDt, uDissipation;
void main(){
  vec2 coord = vUv - uDt * texture(uVelocity, vUv).xy * uTexel;
  o = texture(uSource, coord) / (1.0 + uDissipation * uDt);
}`;

const FRAG_SPLAT = `#version 300 es
precision highp float; precision highp sampler2D;
in vec2 vUv; out vec4 o;
uniform sampler2D uTarget;
uniform float uAspect, uRadius;
uniform vec2 uPoint; uniform vec3 uColor;
void main(){
  vec2 p = vUv - uPoint; p.x *= uAspect;
  vec3 base = texture(uTarget, vUv).xyz;
  o = vec4(base + exp(-dot(p,p) / uRadius) * uColor, 1.0);
}`;

const FRAG_CURL = `#version 300 es
precision highp float; precision highp sampler2D;
in vec2 vUv; out vec4 o;
uniform sampler2D uVelocity; uniform vec2 uTexel;
void main(){
  float L = texture(uVelocity, vUv - vec2(uTexel.x, 0.0)).y;
  float R = texture(uVelocity, vUv + vec2(uTexel.x, 0.0)).y;
  float B = texture(uVelocity, vUv - vec2(0.0, uTexel.y)).x;
  float T = texture(uVelocity, vUv + vec2(0.0, uTexel.y)).x;
  o = vec4(0.5 * (R - L - T + B), 0.0, 0.0, 1.0);
}`;

const FRAG_VORTICITY = `#version 300 es
precision highp float; precision highp sampler2D;
in vec2 vUv; out vec4 o;
uniform sampler2D uVelocity, uCurl;
uniform vec2 uTexel; uniform float uCurlStrength, uDt;
void main(){
  float L = texture(uCurl, vUv - vec2(uTexel.x, 0.0)).x;
  float R = texture(uCurl, vUv + vec2(uTexel.x, 0.0)).x;
  float B = texture(uCurl, vUv - vec2(0.0, uTexel.y)).x;
  float T = texture(uCurl, vUv + vec2(0.0, uTexel.y)).x;
  float C = texture(uCurl, vUv).x;
  vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
  force /= length(force) + 1e-4;
  force *= uCurlStrength * C;
  force.y *= -1.0;
  vec2 vel = texture(uVelocity, vUv).xy + force * uDt;
  o = vec4(clamp(vel, vec2(-1000.0), vec2(1000.0)), 0.0, 1.0);
}`;

const FRAG_AMBIENT = `#version 300 es
precision highp float; precision highp sampler2D;
in vec2 vUv; out vec4 o;
uniform sampler2D uVelocity;
uniform vec2 uWind; uniform float uDrift, uTime, uDt;
vec2 swirl(vec2 p, float t){
  float a = sin(p.y * 4.0 + t * 0.30) * cos(p.x * 3.0 - t * 0.21);
  float b = cos(p.y * 3.5 - t * 0.26) * sin(p.x * 4.5 + t * 0.33);
  return vec2(a, b);
}
void main(){
  vec2 vel = texture(uVelocity, vUv).xy;
  vel += (uWind + swirl(vUv, uTime) * uDrift) * uDt;
  o = vec4(vel, 0.0, 1.0);
}`;

const FRAG_DIVERGENCE = `#version 300 es
precision highp float; precision highp sampler2D;
in vec2 vUv; out vec4 o;
uniform sampler2D uVelocity; uniform vec2 uTexel;
void main(){
  float L = texture(uVelocity, vUv - vec2(uTexel.x, 0.0)).x;
  float R = texture(uVelocity, vUv + vec2(uTexel.x, 0.0)).x;
  float B = texture(uVelocity, vUv - vec2(0.0, uTexel.y)).y;
  float T = texture(uVelocity, vUv + vec2(0.0, uTexel.y)).y;
  o = vec4(0.5 * (R - L + T - B), 0.0, 0.0, 1.0);
}`;

const FRAG_CLEAR = `#version 300 es
precision highp float; precision highp sampler2D;
in vec2 vUv; out vec4 o;
uniform sampler2D uTexture; uniform float uValue;
void main(){ o = uValue * texture(uTexture, vUv); }`;

const FRAG_PRESSURE = `#version 300 es
precision highp float; precision highp sampler2D;
in vec2 vUv; out vec4 o;
uniform sampler2D uPressure, uDivergence; uniform vec2 uTexel;
void main(){
  float L = texture(uPressure, vUv - vec2(uTexel.x, 0.0)).x;
  float R = texture(uPressure, vUv + vec2(uTexel.x, 0.0)).x;
  float B = texture(uPressure, vUv - vec2(0.0, uTexel.y)).x;
  float T = texture(uPressure, vUv + vec2(0.0, uTexel.y)).x;
  float div = texture(uDivergence, vUv).x;
  o = vec4((L + R + B + T - div) * 0.25, 0.0, 0.0, 1.0);
}`;

const FRAG_GRADIENT = `#version 300 es
precision highp float; precision highp sampler2D;
in vec2 vUv; out vec4 o;
uniform sampler2D uPressure, uVelocity; uniform vec2 uTexel;
void main(){
  float L = texture(uPressure, vUv - vec2(uTexel.x, 0.0)).x;
  float R = texture(uPressure, vUv + vec2(uTexel.x, 0.0)).x;
  float B = texture(uPressure, vUv - vec2(0.0, uTexel.y)).x;
  float T = texture(uPressure, vUv + vec2(0.0, uTexel.y)).x;
  vec2 vel = texture(uVelocity, vUv).xy - vec2(R - L, T - B);
  o = vec4(vel, 0.0, 1.0);
}`;

const FRAG_RESTORE = `#version 300 es
precision highp float; precision highp sampler2D;
in vec2 vUv; out vec4 o;
uniform sampler2D uDye, uWord;
uniform float uRestore, uDt, uSweep;
void main(){
  float d = texture(uDye, vUv).x;
  float w = texture(uWord, vUv).x;
  float reveal = smoothstep(vUv.x, vUv.x + 0.12, uSweep);   // the word writes itself in
  float k = (1.0 - exp(-uRestore * 60.0 * uDt)) * reveal;
  o = vec4(mix(d, w, k), 0.0, 0.0, 1.0);
}`;

const FRAG_DISPLAY = `#version 300 es
precision highp float; precision highp sampler2D;
in vec2 vUv; out vec4 o;
uniform sampler2D uDye, uVelocity, uVideo, uWord;
uniform vec2 uRes, uParallax, uDyeTexel;
uniform float uTime, uWarm, uBeat, uHasVideo, uVideoAspect, uFocusY, uCalmBase;
uniform float uGain, uSat, uGamma, uEdge, uVignette, uVideoMix, uRefract, uChroma;
uniform vec3 uBg, uInk, uAmber;

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash(i), b = hash(i + vec2(1.0, 0.0));
  float c = hash(i + vec2(0.0, 1.0)), e = hash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, e, f.x), f.y);
}
float fbm(vec2 p){
  float v = 0.0, a = 0.55;
  for (int i = 0; i < 4; i++){ v += a * vnoise(p); p = p * 2.03 + 17.1; a *= 0.5; }
  return v;
}
vec2 cover(vec2 uv, float ca, float va, float focusY){
  if (ca > va){ uv.y = focusY + (uv.y - 0.5) * (va / ca); }
  else        { uv.x = 0.5    + (uv.x - 0.5) * (ca / va); }
  return uv;
}
vec2 vflip(vec2 uv){ uv = clamp(uv, 0.0, 1.0); uv.y = 1.0 - uv.y; return uv; }

/* shader homage to the footage: domain-warped smoke + drifting night bokeh */
vec3 sceneFallback(vec2 uv, float aspect){
  vec2 p = uv * vec2(aspect, 1.0);
  float t = uTime * 0.04;
  float lm = step(0.5, (uBg.r + uBg.g + uBg.b) / 3.0);   // light mode?
  vec2 warp = vec2(fbm(p * 1.6 + t), fbm(p * 1.6 - t * 0.8));
  float smoke = fbm(p * 2.1 + warp * 1.35 - vec2(0.0, t * 0.5));
  vec3 col = uBg * mix(0.72 + smoke * 0.55, 0.94 + smoke * 0.08, lm);
  float horizon = exp(-pow((uv.y - 0.34) * 3.2, 2.0));
  col += uAmber * horizon * (0.05 + smoke * 0.06) * mix(1.0, 0.45, lm);
  for (int i = 0; i < 7; i++){
    float fi = float(i) + 1.0;
    float sp = 0.03 + 0.05 * hash(vec2(fi, 9.2));
    vec2 c = vec2(fract(hash(vec2(fi, 1.7)) + t * sp) * aspect,
                  0.20 + 0.45 * hash(vec2(fi, 4.3)) + 0.015 * sin(t * 2.6 + fi * 2.1));
    float r = 0.014 + 0.05 * hash(vec2(fi, 6.6));
    float g = exp(-dot(p - c, p - c) / (r * r * 2.0));
    vec3 bc = mix(uAmber, vec3(0.95, 0.90, 0.80), hash(vec2(fi, 3.3)));
    col += bc * g * (0.05 + 0.10 * hash(vec2(fi, 8.8))) * (0.6 + smoke) * (1.0 - lm * 0.8);
  }
  return col;
}
void main(){
  float aspect = uRes.x / uRes.y;
  vec2 vel  = texture(uVelocity, vUv).xy;
  float calm = 1.0 - smoothstep(uCalmBase + 4.0, uCalmBase + 26.0, length(vel));

  /* heat shimmer only while the fluid is actually moving — never at rest */
  vec2 shim = (vec2(vnoise(vUv * 90.0 + uTime * 1.7),
                    vnoise(vUv * 90.0 - uTime * 1.4)) - 0.5) * 0.0016 * (1.0 - calm);
  vec2 duv = vUv + shim;
  float d = clamp(texture(uDye, duv).x, 0.0, 1.6);

  /* cross-blurred dye vs. cross-blurred word: how settled is this pixel? */
  vec2 ox = vec2(uDyeTexel.x * 4.0, 0.0), oy = vec2(0.0, uDyeTexel.y * 4.0);
  float db = (d + texture(uDye, duv + ox).x + texture(uDye, duv - ox).x
                + texture(uDye, duv + oy).x + texture(uDye, duv - oy).x) * 0.2;
  float wHi = texture(uWord, vUv).x;
  float wb  = (wHi + texture(uWord, vUv + ox).x + texture(uWord, vUv - ox).x
                   + texture(uWord, vUv + oy).x + texture(uWord, vUv - oy).x) * 0.2;
  float match  = 1.0 - smoothstep(0.10, 0.32, abs(db - wb));
  float settle = calm * match;

  /* ---- background ---- */
  /* distortion keyed to EXCESS motion only — a resting frame is a clean frame */
  float speed  = length(vel);
  float excess = max(0.0, speed - (uCalmBase + 2.0));
  vec2  velE   = vel * (excess / max(speed, 1e-4));
  vec3 base;
  if (uHasVideo > 0.5){
    vec2 off = clamp(velE * uRefract, vec2(-0.035), vec2(0.035)) * (0.45 + min(d, 1.0));
    off *= 1.0 + uBeat * 0.5;
    vec2 uvR = vflip(cover(vUv + off * (2.0 - uChroma) + uParallax, aspect, uVideoAspect, uFocusY));
    vec2 uvG = vflip(cover(vUv + off               + uParallax, aspect, uVideoAspect, uFocusY));
    vec2 uvB = vflip(cover(vUv + off * uChroma     + uParallax, aspect, uVideoAspect, uFocusY));
    vec3 vid = vec3(texture(uVideo, uvR).r, texture(uVideo, uvG).g, texture(uVideo, uvB).b);
    float luma = dot(vid, vec3(0.299, 0.587, 0.114));
    vid = mix(vec3(luma), vid, uSat);
    vid = pow(vid, vec3(uGamma)) * uGain * (1.0 + uBeat * 0.06);
    base = mix(uBg, vid, uVideoMix);
  } else {
    base = sceneFallback(vUv + uParallax * 0.6, aspect);
  }

  /* legibility scrim: a breath of shadow under the ink where the footage runs bright */
  float bl = dot(base, vec3(0.299, 0.587, 0.114));
  float scrim = max(wb, db * 0.8) * smoothstep(0.35, 0.80, bl) * 0.5;
  base *= 1.0 - scrim;

  /* ---- ink: fluid ↔ crisp handoff ---- */
  float coreF = smoothstep(0.16, 0.92, d);
  float cover2 = mix(coreF, wHi, settle);
  float edge = smoothstep(0.015, 0.24, d) * (1.0 - smoothstep(0.22, 0.78, d)) * (1.0 - settle * 0.55);
  float halo = smoothstep(0.004, 0.16, db) * (1.0 - smoothstep(0.10, 0.55, db)) * (1.0 - settle * 0.45);
  vec3 ink = mix(mix(uInk, vec3(0.862, 0.894, 0.933), 0.35 * step(0.5, uInk.r)), uInk, uWarm);
  vec3 amberGlow = uAmber * mix(0.50, 0.85, uWarm);
  vec3 col = mix(base, amberGlow, halo * (0.16 + uBeat * 0.12));
  col = mix(col, amberGlow, edge * uEdge);
  col = mix(col, ink, cover2);

  col = mix(col, col * col * (3.0 - 2.0 * col), 0.16);               // filmic-lite contrast
  vec2 q = vUv - 0.5;
  col *= 1.0 - uVignette * dot(q, q);                                // vignette
  col += (hash(vUv * uRes + fract(uTime) * 971.0) - 0.5) * 0.028;    // grain
  o = vec4(col, 1.0);
}`;

/* ---- program plumbing ----------------------------------------------------- */
function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    fail("shader error —\n" + gl.getShaderInfoLog(s));
  return s;
}
const vertShader = compile(gl.VERTEX_SHADER, VERT);
function program(fragSrc){
  const p = gl.createProgram();
  gl.attachShader(p, vertShader);
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fragSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS))
    fail("link error —\n" + gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++){
    const name = gl.getActiveUniform(p, i).name;
    u[name] = gl.getUniformLocation(p, name);
  }
  return { p, u, use(){ gl.useProgram(p); } };
}

const prg = {
  advect:     program(FRAG_ADVECT),
  splat:      program(FRAG_SPLAT),
  curl:       program(FRAG_CURL),
  vorticity:  program(FRAG_VORTICITY),
  ambient:    program(FRAG_AMBIENT),
  divergence: program(FRAG_DIVERGENCE),
  clear:      program(FRAG_CLEAR),
  pressure:   program(FRAG_PRESSURE),
  gradient:   program(FRAG_GRADIENT),
  restore:    program(FRAG_RESTORE),
  display:    program(FRAG_DISPLAY),
};

/* fullscreen quad */
const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
function bindQuad(p){
  const loc = gl.getAttribLocation(p, "aPos");
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
}
function blit(target){
  if (target){ gl.viewport(0, 0, target.w, target.h); gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo); }
  else       { gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight); gl.bindFramebuffer(gl.FRAMEBUFFER, null); }
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

/* ---- FBOs ------------------------------------------------------------------ */
function createFBO(w, h){
  const tex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.viewport(0, 0, w, h);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE)
    fail("fbo incomplete — half-float render unsupported.");
  return { tex, fbo, w, h, texel: [1 / w, 1 / h],
           attach(unit){ gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, this.tex); return unit; } };
}
function createDoubleFBO(w, h){
  return { read: createFBO(w, h), write: createFBO(w, h), w, h, texel: [1 / w, 1 / h],
           swap(){ const t = this.read; this.read = this.write; this.write = t; } };
}
function gridSize(short){
  const a = canvas.width / canvas.height;
  return a >= 1 ? { w: Math.round(short * a), h: short } : { w: short, h: Math.round(short / a) };
}

let velocity, dye, pressure, divergence, curlFBO, wordTex = null;

function initFramebuffers(){
  const s = gridSize(CFG.SIM_RES), d = gridSize(CFG.DYE_RES);
  velocity   = createDoubleFBO(s.w, s.h);
  pressure   = createDoubleFBO(s.w, s.h);
  divergence = createFBO(s.w, s.h);
  curlFBO    = createFBO(s.w, s.h);
  dye        = createDoubleFBO(d.w, d.h);
}

/* ---- wordmark texture ------------------------------------------------------ */
function buildWordTexture(){
  /* full display resolution (capped 2048) — the crisp layer samples this 1:1 */
  const s = Math.min(1, 2048 / Math.max(canvas.width, canvas.height));
  const W = Math.max(2, Math.round(canvas.width * s));
  const H = Math.max(2, Math.round(canvas.height * s));
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  let size = Math.round(H * 0.34);
  const font = f => CFG.FONT.replace("SIZE", f);
  ctx.font = font(size);
  try { ctx.letterSpacing = "0.01em"; } catch (e) {}
  const maxW = W * CFG.WORD_WIDTH;
  const w = ctx.measureText(CFG.TEXT).width;
  if (w > maxW){ size = Math.floor(size * maxW / w); ctx.font = font(size); }
  ctx.fillStyle = "#fff";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(CFG.TEXT, W / 2, H / 2 + size * 0.04);

  if (wordTex) gl.deleteTexture(wordTex);
  wordTex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, wordTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.generateMipmap(gl.TEXTURE_2D);   // clean minification into the sim's restore pass
}
function attachWord(unit){ gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, wordTex); return unit; }

/* ---- background video → texture ------------------------------------------- */
let theme = "dark";
const vids = {}, vidOK = {};
let videoTex = null, lastVideoTime = -1, videoAspect = 1;

function initVideos(){
  videoTex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0 + 2);
  gl.bindTexture(gl.TEXTURE_2D, videoTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE,
                new Uint8Array([0, 0, 0, 255]));
  for (const t of ["dark", "light"]){
    const v = document.createElement("video");
    v.src = CFG.VIDEO[t];
    v.muted = true; v.loop = true; v.playsInline = true;
    v.setAttribute("playsinline", ""); v.setAttribute("muted", "");
    v.preload = "auto"; v.className = "srcvid";
    v.addEventListener("canplay", () => { vidOK[t] = true; });
    v.addEventListener("error",   () => { vidOK[t] = false; });
    document.body.appendChild(v);
    vids[t] = v;
    if (t === theme) v.play().catch(() => {});
  }
}
const bgstatEl = document.getElementById("bgstat");
let bgstatLast = null, videoDead = false, lastPlayTry = 0;
function setBgStat(live){
  if (live === bgstatLast) return;
  bgstatLast = live;
  bgstatEl.textContent = live ? "bg · video" : "bg · shader";
}
function uploadVideo(){
  gl.activeTexture(gl.TEXTURE0 + 2);
  gl.bindTexture(gl.TEXTURE_2D, videoTex);
  const v = vids[theme];
  if (videoDead || !v || !vidOK[theme] || v.readyState < 2){ setBgStat(false); return 0; }
  if (v.paused && performance.now() - lastPlayTry > 2000){
    lastPlayTry = performance.now();
    v.play().catch(() => {});
  }
  if (v.currentTime !== lastVideoTime){
    try {
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, v);
      lastVideoTime = v.currentTime;
      videoAspect = (v.videoWidth || 1) / (v.videoHeight || 1);
    } catch (e) {
      videoDead = true;   // file:// taints video→WebGL on some browsers — use the shader scene
      setBgStat(false); return 0;
    }
  }
  setBgStat(true); return 1;
}
function focusYClamped(th){
  const ca = canvas.width / canvas.height, va = videoAspect || 1;
  if (ca <= va) return 0.5;
  const half = 0.5 * (va / ca);
  return Math.min(1 - half, Math.max(half, th.FOCUS_Y));
}

/* theme */
const themeBtn = document.getElementById("themeBtn");
function setTheme(t){
  theme = t;
  document.body.classList.toggle("light", t === "light");
  themeBtn.textContent = t === "dark" ? "[ light ]" : "[ dark ]";
  lastVideoTime = -1;
  const on = vids[t], off = vids[t === "dark" ? "light" : "dark"];
  if (on)  on.play().catch(() => {});
  if (off) off.pause();
}
themeBtn.addEventListener("click", () => setTheme(theme === "dark" ? "light" : "dark"));

/* ---- optional sound → beat ------------------------------------------------- */
const soundBtn = document.getElementById("soundBtn");
let audioEl = null, actx = null, analyser = null, freq = null, beat = 0, soundOn = false;
(function initSoundUI(){
  audioEl = new Audio();
  audioEl.src = CFG.AUDIO; audioEl.loop = true; audioEl.preload = "auto";
  audioEl.addEventListener("canplaythrough", () => { soundBtn.style.display = ""; }, { once: true });
  audioEl.addEventListener("error", () => { soundBtn.style.display = "none"; });
})();
soundBtn.addEventListener("click", async () => {
  if (!soundOn){
    try {
      if (!actx){
        actx = new (window.AudioContext || window.webkitAudioContext)();
        const srcNode = actx.createMediaElementSource(audioEl);
        analyser = actx.createAnalyser(); analyser.fftSize = 256;
        srcNode.connect(analyser); analyser.connect(actx.destination);
        freq = new Uint8Array(analyser.frequencyBinCount);
      }
      await actx.resume(); await audioEl.play();
      soundOn = true; soundBtn.classList.add("on"); soundBtn.textContent = "[ sound · on ]";
    } catch (e) {}
  } else {
    audioEl.pause(); soundOn = false;
    soundBtn.classList.remove("on"); soundBtn.textContent = "[ sound ]";
  }
});
function beatTick(){
  if (!soundOn || !analyser){ beat += (0 - beat) * 0.05; return; }
  analyser.getByteFrequencyData(freq);
  let s = 0; const n = 10;                                   // low band
  for (let i = 1; i <= n; i++) s += freq[i];
  const e = s / (n * 255);
  beat += (e > beat) ? (e - beat) * 0.35 : (e - beat) * 0.06; // fast attack, slow release
}
function beatOut(){ return Math.min(1, Math.max(0, (beat - 0.30) * 1.6)); }

/* ---- interaction ----------------------------------------------------------- */
const splats = [];          // {x, y, dx, dy, r}
const pointers = new Map(); // id -> {x, y}
let touchedOnce = false, lastInput = 0;

function toUV(e){ const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width, y: 1 - (e.clientY - r.top) / r.height }; }

canvas.addEventListener("pointerdown", e => {
  const p = toUV(e);
  pointers.set(e.pointerId, p);
  splats.push({ x: p.x, y: p.y, dx: (Math.random() - .5) * 220, dy: (Math.random() - .5) * 220, r: 1.6 });
  document.body.classList.add("down");
  markTouched();
});
canvas.addEventListener("pointermove", e => {
  cursorTo(e.clientX, e.clientY);
  const prev = pointers.get(e.pointerId);
  if (!prev) return;
  const p = toUV(e);
  const dx = (p.x - prev.x) * CFG.SPLAT_FORCE;
  const dy = (p.y - prev.y) * CFG.SPLAT_FORCE;
  if (dx * dx + dy * dy > 0) splats.push({ x: p.x, y: p.y, dx, dy, r: 1 });
  pointers.set(e.pointerId, p);
  markTouched();
});
addEventListener("pointerup",     e => { pointers.delete(e.pointerId); document.body.classList.remove("down"); });
addEventListener("pointercancel", e => { pointers.delete(e.pointerId); document.body.classList.remove("down"); });
addEventListener("pointermove",   e => cursorTo(e.clientX, e.clientY));
function markTouched(){ lastInput = performance.now();
  if (!touchedOnce){
    touchedOnce = true; document.body.classList.add("touched");
    /* first gesture unlocks decode on strict mobile browsers */
    for (const k in vids){ const p = vids[k].play();
      if (p) p.then(() => { if (k !== theme) vids[k].pause(); }).catch(() => {}); }
  } }

/* custom cursor */
const cursorEl = document.getElementById("cursor");
let cx = innerWidth / 2, cy = innerHeight / 2, tx = cx, ty = cy;
let sx = 0.5, sy = 0.5;                       // slow-follow, feeds video parallax
function cursorTo(x, y){ tx = x; ty = y; }
function cursorTick(){
  cx += (tx - cx) * 0.18; cy += (ty - cy) * 0.18;
  sx += (tx / innerWidth  - sx) * 0.05;
  sy += (ty / innerHeight - sy) * 0.05;
  cursorEl.style.transform = `translate(${cx - 7}px, ${cy - 7}px)`;
}

/* ---- weather → forces ------------------------------------------------------ */
const wx = { wind: [0, 0], warm: 0.5, rain: 0, label: "offline" };
const WXEL = document.getElementById("wx");

function describe(code){
  if (code === 0) return "clear";
  if (code <= 2)  return "fair";
  if (code === 3) return "overcast";
  if (code <= 48) return "fog";
  if (code <= 57) return "drizzle";
  if (code <= 67) return "rain";
  if (code <= 77) return "snow";
  if (code <= 82) return "showers";
  if (code <= 86) return "snow";
  return "storm";
}
function rainInterval(code){
  if (code >= 95) return 0.40;
  if (code >= 80 && code <= 82) return 0.70;
  if (code >= 61 && code <= 67) return 0.95;
  if (code >= 51 && code <= 57) return 1.60;
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return 1.80;
  return 0;
}
async function fetchWeather(){
  if (!CFG.WEATHER) return;
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${CFG.LAT}&longitude=${CFG.LON}` +
                `&current=temperature_2m,weather_code,wind_speed_10m,wind_direction_10m,is_day&timezone=auto`;
    const res = await fetch(url, { signal: AbortSignal.timeout ? AbortSignal.timeout(6000) : undefined });
    const j = await res.json();
    const c = j.current;
    const toward = (c.wind_direction_10m + 180) * Math.PI / 180;   // met. dir = where wind comes FROM
    const amp = Math.min(c.wind_speed_10m, 50) / 50 * CFG.WIND_MAX;
    wx.wind = [Math.sin(toward) * amp, Math.cos(toward) * amp];
    wx.warm = Math.max(0, Math.min(1, (c.temperature_2m + 5) / 35));
    wx.rain = rainInterval(c.weather_code);
    wx.label = `${c.temperature_2m.toFixed(1)}° · wind ${Math.round(c.wind_speed_10m)} km/h · ${describe(c.weather_code)}`;
  } catch (e) {
    wx.label = "weather offline";
  }
  WXEL.textContent = wx.label;
  WXEL.classList.remove("dim");
}

/* clock — always Eindhoven time */
const clockEl = document.getElementById("clock");
const timeFmt = new Intl.DateTimeFormat("en-GB", { timeZone: CFG.TZ, hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
setInterval(() => { clockEl.textContent = timeFmt.format(new Date()); }, 250);

/* ---- sim steps ------------------------------------------------------------- */
function applySplat(s){
  prg.splat.use(); bindQuad(prg.splat.p);
  gl.uniform1i(prg.splat.u.uTarget, velocity.read.attach(0));
  gl.uniform1f(prg.splat.u.uAspect, canvas.width / canvas.height);
  gl.uniform2f(prg.splat.u.uPoint, s.x, s.y);
  gl.uniform3f(prg.splat.u.uColor, s.dx, s.dy, 0);
  gl.uniform1f(prg.splat.u.uRadius, CFG.SPLAT_RADIUS * (s.r || 1));
  blit(velocity.write); velocity.swap();
}

let running = true, lastT = performance.now(), simT = 0;
let restoreRate = CFG.RESTORE_INTRO, startT = performance.now();
let rainT = 0, idleT = 0;

function frame(now){
  requestAnimationFrame(frame);
  if (!running || !wordTex) { lastT = now; return; }
  const dt = Math.min((now - lastT) / 1000, 1 / 30);
  lastT = now; simT += dt;
  cursorTick(); beatTick();
  const bt = beatOut();

  /* intro: the word writes itself out of turbulence, then settles */
  const age = (now - startT) / 1000;
  restoreRate = age < 4 ? CFG.RESTORE + (CFG.RESTORE_INTRO - CFG.RESTORE) * Math.exp(-age * 1.4)
                        : CFG.RESTORE;
  const sweep = Math.min(2, age * 0.56);
  const rr = restoreRate * (1 - bt * 0.45);   // bass loosens the ink

  /* rain droplets (weather-driven) */
  if (wx.rain > 0 && !REDUCED){
    rainT += dt;
    if (rainT > wx.rain){
      rainT = 0;
      splats.push({ x: Math.random(), y: 0.92 + Math.random() * 0.06,
                    dx: (Math.random() - .5) * 30, dy: -(60 + Math.random() * 70), r: 0.28 });
    }
  }
  /* idle life: an occasional near-invisible stir */
  if (!REDUCED && now - lastInput > 7000){
    idleT += dt;
    if (idleT > 5 + Math.random() * 4){
      idleT = 0;
      const a = Math.random() * Math.PI * 2;
      splats.push({ x: .2 + Math.random() * .6, y: .25 + Math.random() * .5,
                    dx: Math.cos(a) * 18, dy: Math.sin(a) * 18, r: 2.2 });
    }
  }

  while (splats.length) applySplat(splats.pop());

  /* curl */
  prg.curl.use(); bindQuad(prg.curl.p);
  gl.uniform1i(prg.curl.u.uVelocity, velocity.read.attach(0));
  gl.uniform2fv(prg.curl.u.uTexel, velocity.texel);
  blit(curlFBO);

  /* vorticity confinement */
  prg.vorticity.use(); bindQuad(prg.vorticity.p);
  gl.uniform1i(prg.vorticity.u.uVelocity, velocity.read.attach(0));
  gl.uniform1i(prg.vorticity.u.uCurl, curlFBO.attach(1));
  gl.uniform2fv(prg.vorticity.u.uTexel, velocity.texel);
  gl.uniform1f(prg.vorticity.u.uCurlStrength, CFG.CURL);
  gl.uniform1f(prg.vorticity.u.uDt, dt);
  blit(velocity.write); velocity.swap();

  /* ambient wind + drift */
  prg.ambient.use(); bindQuad(prg.ambient.p);
  gl.uniform1i(prg.ambient.u.uVelocity, velocity.read.attach(0));
  gl.uniform2f(prg.ambient.u.uWind, wx.wind[0], wx.wind[1]);
  gl.uniform1f(prg.ambient.u.uDrift, CFG.DRIFT * (1 + bt * 0.8));
  gl.uniform1f(prg.ambient.u.uTime, simT);
  gl.uniform1f(prg.ambient.u.uDt, dt);
  blit(velocity.write); velocity.swap();

  /* divergence */
  prg.divergence.use(); bindQuad(prg.divergence.p);
  gl.uniform1i(prg.divergence.u.uVelocity, velocity.read.attach(0));
  gl.uniform2fv(prg.divergence.u.uTexel, velocity.texel);
  blit(divergence);

  /* pressure */
  prg.clear.use(); bindQuad(prg.clear.p);
  gl.uniform1i(prg.clear.u.uTexture, pressure.read.attach(0));
  gl.uniform1f(prg.clear.u.uValue, 0.8);
  blit(pressure.write); pressure.swap();

  prg.pressure.use(); bindQuad(prg.pressure.p);
  gl.uniform2fv(prg.pressure.u.uTexel, velocity.texel);
  gl.uniform1i(prg.pressure.u.uDivergence, divergence.attach(1));
  for (let i = 0; i < CFG.PRESSURE_ITERS; i++){
    gl.uniform1i(prg.pressure.u.uPressure, pressure.read.attach(0));
    blit(pressure.write); pressure.swap();
  }

  /* subtract gradient */
  prg.gradient.use(); bindQuad(prg.gradient.p);
  gl.uniform2fv(prg.gradient.u.uTexel, velocity.texel);
  gl.uniform1i(prg.gradient.u.uPressure, pressure.read.attach(0));
  gl.uniform1i(prg.gradient.u.uVelocity, velocity.read.attach(1));
  blit(velocity.write); velocity.swap();

  /* advect velocity */
  prg.advect.use(); bindQuad(prg.advect.p);
  gl.uniform2fv(prg.advect.u.uTexel, velocity.texel);
  gl.uniform1f(prg.advect.u.uDt, dt);
  gl.uniform1i(prg.advect.u.uVelocity, velocity.read.attach(0));
  gl.uniform1i(prg.advect.u.uSource,   velocity.read.attach(0));
  gl.uniform1f(prg.advect.u.uDissipation, CFG.VEL_DISSIPATION);
  blit(velocity.write); velocity.swap();

  /* advect dye */
  gl.uniform1i(prg.advect.u.uVelocity, velocity.read.attach(0));
  gl.uniform1i(prg.advect.u.uSource,   dye.read.attach(1));
  gl.uniform1f(prg.advect.u.uDissipation, CFG.DYE_DISSIPATION);
  blit(dye.write); dye.swap();

  /* restore toward the word */
  prg.restore.use(); bindQuad(prg.restore.p);
  gl.uniform1i(prg.restore.u.uDye,  dye.read.attach(0));
  gl.uniform1i(prg.restore.u.uWord, attachWord(1));
  gl.uniform1f(prg.restore.u.uRestore, rr);
  gl.uniform1f(prg.restore.u.uSweep, sweep);
  gl.uniform1f(prg.restore.u.uDt, dt);
  blit(dye.write); dye.swap();

  /* post */
  const th = CFG.THEMES[theme];
  const hasVideo = uploadVideo();
  prg.display.use(); bindQuad(prg.display.p);
  gl.uniform1i(prg.display.u.uDye, dye.read.attach(0));
  gl.uniform1i(prg.display.u.uVelocity, velocity.read.attach(1));
  gl.uniform1i(prg.display.u.uVideo, 2);   // bound in uploadVideo
  gl.uniform1i(prg.display.u.uWord, attachWord(3));
  gl.uniform1f(prg.display.u.uCalmBase,
    (Math.hypot(wx.wind[0], wx.wind[1]) + CFG.DRIFT * 0.7) / CFG.VEL_DISSIPATION);
  gl.uniform2f(prg.display.u.uRes, canvas.width, canvas.height);
  gl.uniform2f(prg.display.u.uParallax, (sx - 0.5) * CFG.PARALLAX, (0.5 - sy) * CFG.PARALLAX);
  gl.uniform2fv(prg.display.u.uDyeTexel, dye.texel);
  gl.uniform1f(prg.display.u.uTime, simT);
  gl.uniform1f(prg.display.u.uWarm, wx.warm);
  gl.uniform1f(prg.display.u.uBeat, bt);
  gl.uniform1f(prg.display.u.uChroma, CFG.CHROMA);
  gl.uniform1f(prg.display.u.uHasVideo, hasVideo);
  gl.uniform1f(prg.display.u.uVideoAspect, videoAspect);
  gl.uniform1f(prg.display.u.uFocusY, focusYClamped(th));
  gl.uniform1f(prg.display.u.uGain, th.GAIN);
  gl.uniform1f(prg.display.u.uSat, th.SAT);
  gl.uniform1f(prg.display.u.uGamma, th.GAMMA);
  gl.uniform1f(prg.display.u.uEdge, th.EDGE);
  gl.uniform1f(prg.display.u.uVignette, th.VIGNETTE);
  gl.uniform1f(prg.display.u.uVideoMix, CFG.VIDEO_MIX);
  gl.uniform1f(prg.display.u.uRefract, CFG.REFRACT);
  gl.uniform3fv(prg.display.u.uBg, th.BG);
  gl.uniform3fv(prg.display.u.uInk, th.INK);
  gl.uniform3fv(prg.display.u.uAmber, th.AMBER);
  blit(null);
}

/* ---- boot / resize --------------------------------------------------------- */
function sizeCanvas(){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(innerWidth  * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
}
function introStir(){
  for (let i = 0; i < 6; i++){
    const a = Math.random() * Math.PI * 2;
    setTimeout(() => splats.push({
      x: .30 + Math.random() * .40, y: .32 + Math.random() * .36,
      dx: Math.cos(a) * (250 + Math.random() * 350),
      dy: Math.sin(a) * (250 + Math.random() * 350), r: 1.5 }), i * 140);
  }
}
let resizeTimer;
addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    sizeCanvas(); initFramebuffers(); buildWordTexture();
    startT = performance.now();          // brief re-coalesce after resize
    if (!REDUCED) introStir();
  }, 200);
});
document.addEventListener("visibilitychange", () => {
  running = !document.hidden;
  lastT = performance.now();
  const v = vids[theme];
  if (v){ if (document.hidden) v.pause(); else v.play().catch(() => {}); }
});

async function boot(){
  sizeCanvas();
  initFramebuffers();
  try { await Promise.race([
    document.fonts.load('700 100px "Space Grotesk"'),
    new Promise(r => setTimeout(r, 1500)),
  ]); } catch (e) {}
  buildWordTexture();
  initVideos();
  startT = performance.now();
  if (!REDUCED) introStir();
  document.body.classList.add("ready");
  fetchWeather();
  setInterval(fetchWeather, 15 * 60 * 1000);
  requestAnimationFrame(frame);
}
boot();
</script>

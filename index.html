<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Patiëntportaal — Toegang</title>
<meta name="description" content="Toegang tot het afscheidsdossier. Een persoonlijk cadeau, geen echt portaal." />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#08090a" />

<meta property="og:type" content="website" />
<meta property="og:title" content="Patiëntportaal — Toegang" />
<meta property="og:description" content="Een persoonlijk afscheid, verpakt als een dossier." />
<meta property="og:locale" content="nl_NL" />
<meta name="twitter:card" content="summary" />

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d8674a'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='17' font-weight='600' fill='%23fff' text-anchor='middle'%3E56%3C/text%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/site.css" />

<style>
  /* ── gate: a single centred card, nothing else on the page ── */
  body{
    min-height:100svh;
    display:grid; place-items:center;
    padding:var(--s-3);
  }
  .gate{
    width:100%; max-width:440px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    overflow:hidden;
    opacity:0; transform:translateY(20px);
    animation:hero-in 820ms var(--ease) 60ms forwards;
  }
  .gate__head{
    padding:var(--s-5) var(--s-4) var(--s-3);
    text-align:center;
    border-bottom:1px solid var(--line);
  }
  .gate__mark{
    width:48px; height:48px; margin:0 auto var(--s-3);
    border-radius:14px; display:grid; place-items:center;
    background:var(--accent); color:var(--accent-ink);
    font-family:'Fraunces', ui-serif, Georgia, serif;
    font-weight:600; font-size:19px;
    cursor:pointer; user-select:none;
    transition:transform var(--dur-hover) var(--ease-out);
  }
  .gate__mark:hover{ transform:scale(1.06); }
  .gate__mark:active{ transform:scale(.94); }
  .gate__title{ margin-top:var(--s-1); }
  .gate__body{ padding:var(--s-4); }
  .field-group + .field-group{ margin-top:var(--s-2); }
  .gate__actions{ margin-top:var(--s-3); }

  /* recognised-user card on step 2 */
  .identity{
    display:flex; align-items:center; gap:12px;
    padding:14px var(--s-2); margin-bottom:var(--s-3);
    border-radius:14px;
    background:var(--accent-soft);
    border:1px solid var(--accent-line);
  }
  .identity__avatar{
    width:38px; height:38px; border-radius:50%; flex-shrink:0;
    display:grid; place-items:center;
    background:var(--accent); color:var(--accent-ink);
    font-weight:600; font-size:15px;
  }
  .identity__name{ font-weight:600; font-size:var(--t-sm); line-height:1.3; }
  .identity__id{
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:var(--t-xs); color:var(--sub);
  }

  .dots{ display:flex; justify-content:center; gap:6px; margin-top:var(--s-3); }
  .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--n-400);
    transition:width var(--dur-hover) var(--ease-out),
               background var(--dur-hover) var(--ease-out);
  }
  .dot.is-active{ width:20px; background:var(--accent); }

  .gate__foot{
    margin-top:var(--s-3);
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:var(--t-xs); line-height:1.8; letter-spacing:.04em;
    color:var(--sub); text-align:center;
  }

  /* ── WIN95 easter egg ───────────────────────────────────────────
     Deliberately the one place the design system is thrown out. It
     only triggers on the toggle, so it costs the default look nothing. */
  .toggle{
    position:fixed; top:var(--s-2); right:var(--s-2); z-index:60;
    display:flex; gap:3px; padding:4px;
    background:rgba(255,255,255,.05);
    border:1px solid var(--line);
    border-radius:100px;
    backdrop-filter:blur(14px);
  }
  .tbtn{
    width:32px; height:32px; border-radius:50%;
    border:none; background:transparent; cursor:pointer;
    display:grid; place-items:center; font-size:14px; opacity:.5;
    transition:opacity var(--dur-hover) var(--ease-out),
               transform var(--dur-hover) var(--ease-out);
  }
  .tbtn:hover{ opacity:1; transform:translateY(-1px); }
  .tbtn.is-active{ opacity:1; background:var(--accent); }

  .win95-title{ display:none; }

  body.win95{
    background:#008080; display:block; padding:var(--s-2);
    font-family:'MS Sans Serif','Microsoft Sans Serif','Segoe UI',Arial,sans-serif;
    color:#000;
  }
  body.win95 .wash,body.win95 .grain{ display:none; }
  body.win95 .gate{
    background:#c0c0c0; border:2px solid;
    border-color:#fff #808080 #808080 #fff;
    border-radius:0; max-width:420px; margin:40px auto;
    animation:none; opacity:1; transform:none;
    box-shadow:2px 2px 0 rgba(0,0,0,.5);
  }
  body.win95 .gate__head{ border-bottom:none; padding:0 0 var(--s-2); text-align:left; }
  body.win95 .gate__mark,body.win95 .eyebrow,body.win95 .dots{ display:none; }
  body.win95 .win95-title{
    display:block; margin:-1px -1px var(--s-2);
    padding:4px 8px; text-align:left;
    background:linear-gradient(to right,#000080,#1084d0);
    color:#fff; font-size:12px; font-weight:bold;
  }
  body.win95 .gate__title,body.win95 .gate__sub{
    font-family:inherit; font-size:12px; color:#000;
    letter-spacing:0; padding-inline:8px;
  }
  body.win95 .gate__title{ font-weight:bold; }
  body.win95 .label{
    font-family:inherit; font-size:11px; font-weight:400;
    text-transform:none; letter-spacing:0; color:#000;
  }
  body.win95 .field{
    border-radius:0; border:1px solid;
    border-color:#808080 #fff #fff #808080;
    background:#fff; color:#000; font-size:11px; padding:4px;
    box-shadow:none;
  }
  body.win95 .btn{
    width:auto; float:right; border-radius:0;
    background:#c0c0c0; color:#000;
    border:2px solid; border-color:#fff #808080 #808080 #fff;
    font-size:11px; font-weight:bold; padding:5px 16px;
  }
  body.win95 .btn:hover{ transform:none; background:#d4d4d4; }
  body.win95 .btn--quiet{ float:left; border:none; background:transparent; }
  body.win95 .gate__actions::after{ content:""; display:block; clear:both; }
  body.win95 .identity{ border-radius:0; border:1px solid #808080; background:#fff; }
  body.win95 .identity__avatar{ border-radius:0; background:#000080; color:#fff; }
  body.win95 .identity__name,body.win95 .identity__id{ color:#000; }
  body.win95 .msg{ border-radius:0; }
  body.win95 .gate__foot{ color:#000; }
  body.win95 .toggle{ border-radius:0; background:#c0c0c0; border-color:#fff #808080 #808080 #fff; }
</style>
</head>
<body>

<div class="wash" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div class="toggle" role="group" aria-label="Weergave">
  <button class="tbtn" type="button" data-theme="premium" aria-label="Moderne weergave">✦</button>
  <button class="tbtn" type="button" data-theme="win95" aria-label="Windows 95-weergave">🖥️</button>
</div>

<main class="gate">
  <div class="win95-title">Patiëntportaal</div>

  <header class="gate__head">
    <div class="gate__mark" id="mark" role="button" tabindex="0" aria-label="Logo">G</div>
    <p class="eyebrow">Patiëntportaal</p>
    <h1 class="h3 gate__title" id="title">Welkom terug</h1>
    <p class="gate__sub muted" style="font-size:var(--t-sm);margin-top:4px" id="subtitle">Log in om verder te gaan</p>
  </header>

  <div class="gate__body">
    <div class="msg msg--error" id="errorMsg" role="alert"></div>
    <div class="msg msg--ok" id="successMsg" role="status"></div>

    <!-- STEP 1 — who are you -->
    <section id="step1">
      <div class="field-group">
        <label class="label" for="username">Gebruikersnaam</label>
        <input class="field" type="text" id="username" autocomplete="username"
               spellcheck="false" placeholder="Uw gebruikerscode" />
      </div>
      <div class="field-group">
        <label class="label" for="location">Locatie</label>
        <select class="field" id="location">
          <option>Eindhoven — OPSY</option>
          <option>Eindhoven — Hoofdlocatie</option>
          <option>Woensel</option>
          <option>Veldhoven</option>
        </select>
      </div>
      <div class="gate__actions">
        <button class="btn btn--block" type="button" id="nextBtn">Volgende</button>
      </div>
      <div class="dots" aria-hidden="true">
        <span class="dot is-active"></span><span class="dot"></span>
      </div>
    </section>

    <!-- STEP 2 — password -->
    <section id="step2" class="is-hidden">
      <div class="identity">
        <div class="identity__avatar" id="avatarInitial" aria-hidden="true">?</div>
        <div>
          <div class="identity__name" id="userDisplay">–</div>
          <div class="identity__id" id="clientIdDisplay">–</div>
        </div>
      </div>
      <div class="field-group">
        <label class="label" for="password">Wachtwoord</label>
        <input class="field" type="password" id="password"
               autocomplete="current-password" placeholder="••••••••" />
      </div>
      <div class="gate__actions">
        <button class="btn btn--block" type="button" id="loginBtn">Inloggen</button>
        <button class="btn btn--quiet btn--block" type="button" id="backBtn">← Terug</button>
      </div>
      <p class="center muted" style="font-size:var(--t-xs);margin-top:var(--s-2)">
        Pogingen: <span id="attempts">0</span>/3
      </p>
      <div class="dots" aria-hidden="true">
        <span class="dot"></span><span class="dot is-active"></span>
      </div>
    </section>

    <p class="gate__foot">
      Patiënt Informatiesysteem · NEN-7510 gecertificeerd<br />
      Alle activiteiten worden gelogd conform beveiligingsbeleid.
    </p>
  </div>
</main>

<div class="toast" id="toast" role="status"></div>

<script src="assets/site.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════
   Patiëntportaal — gemaakt door 56 · @56isk · github.com/56snty
   Een afscheidscadeau, geen echt portaal. De wachtwoorden staan met
   opzet in de client: dit is een grap tussen vrienden, geen
   beveiliging. Er zit hier niets achter wat het beschermen waard is.
   ══════════════════════════════════════════════════════════════════ */

/* passwords live only here, on the gate */
var PASSWORDS = {
  gebruiker162:'Spanje2026!',  gebruiker726:'ZW2!',
  gebruiker492:'Wateentoestand!', gebruiker892:'Tanteleo!',
  gebruiker83:'House1!',       gebruiker744:'Estherrr!',
  gebruiker56:'Viaplay!',      gebruiker729:'Veronique!',
  admin:'Poep123!'
};
var DEST = { admin:'admin.html' };

var USERS = GGZ.USERS;

var step1 = document.getElementById('step1');
var step2 = document.getElementById('step2');
var usernameInput = document.getElementById('username');
var passwordInput = document.getElementById('password');
var nextBtn = document.getElementById('nextBtn');
var backBtn = document.getElementById('backBtn');
var loginBtn = document.getElementById('loginBtn');
var errorMsg = document.getElementById('errorMsg');
var successMsg = document.getElementById('successMsg');

var currentUser = null, currentKey = null, attempts = 0;

function showError(m){
  errorMsg.textContent = m;
  errorMsg.classList.add('is-shown');
  successMsg.classList.remove('is-shown');
}
function showSuccess(m){
  successMsg.textContent = m;
  successMsg.classList.add('is-shown');
  errorMsg.classList.remove('is-shown');
}
function hideMsgs(){
  errorMsg.classList.remove('is-shown');
  successMsg.classList.remove('is-shown');
}

/* ── theme toggle ── */
function applyTheme(t){
  document.body.classList.toggle('win95', t === 'win95');
  document.querySelectorAll('.tbtn').forEach(function(b){
    var on = b.dataset.theme === t;
    b.classList.toggle('is-active', on);
    b.setAttribute('aria-pressed', String(on));
  });
  try{ localStorage.setItem('siteTheme', t); }catch(e){}
}
document.querySelector('.toggle').addEventListener('click', function(e){
  var b = e.target.closest('.tbtn');
  if(!b) return;
  applyTheme(b.dataset.theme);
  GGZ.log('theme_change', { theme:b.dataset.theme });
});
var savedTheme = 'premium';
try{ savedTheme = localStorage.getItem('siteTheme') || 'premium'; }catch(e){}
applyTheme(savedTheme);

/* ── STEP 1: recognise the user ── */
nextBtn.addEventListener('click', function(){
  var key = usernameInput.value.trim().toLowerCase();
  if(!key){ showError('Voer een gebruikersnaam in.'); usernameInput.focus(); return; }

  if(USERS[key]){
    currentUser = USERS[key];
    currentKey = key;
    hideMsgs();
    GGZ.applyUserAccent(currentUser);

    document.getElementById('userDisplay').textContent = currentUser.name;
    document.getElementById('clientIdDisplay').textContent = currentUser.clientId;
    document.getElementById('avatarInitial').textContent = currentUser.name.charAt(0);
    document.getElementById('title').textContent = 'Dag ' + currentUser.first;
    document.getElementById('subtitle').textContent = 'Voer uw wachtwoord in om verder te gaan';

    step1.classList.add('is-hidden');
    step2.classList.remove('is-hidden');
    passwordInput.focus();
    GGZ.log('auth_username_ok', { name:currentUser.name }, key);
  } else {
    showError('Gebruikersnaam niet gevonden. Controleer de spelling.');
    GGZ.log('auth_username_fail', { attempted:key }, key);
  }
});
usernameInput.addEventListener('keydown', function(e){
  if(e.key === 'Enter') nextBtn.click();
});

/* ── STEP 2: password, with escalating (friendly) copy ── */
var FAIL_LINES = [
  function(p){ return 'Onjuist wachtwoord. Poging ' + p + ' van 3.'; },
  function(p){ return 'Nog steeds niet. Even goed nadenken… poging ' + p + ' van 3.'; },
  function(p){ return 'Laatste poging (' + p + '/3). Geen druk. Oké, een beetje druk.'; }
];

loginBtn.addEventListener('click', function(){
  var pw = passwordInput.value;
  if(!pw){ showError('Voer een wachtwoord in.'); passwordInput.focus(); return; }

  if(pw === PASSWORDS[currentKey]){
    showSuccess('Authenticatie geslaagd — sessie wordt gestart…');
    loginBtn.disabled = true;
    loginBtn.textContent = 'Bezig…';
    try{ localStorage.setItem('currentUser', currentKey); }catch(e){}
    GGZ.log('login_success', { name:currentUser.name, clientId:currentUser.clientId }, currentKey);
    var dest = DEST[currentKey] || 'units.html';
    setTimeout(function(){
      window.location.href = dest + '?user=' + encodeURIComponent(currentKey);
    }, 800);
  } else {
    attempts++;
    document.getElementById('attempts').textContent = attempts;
    GGZ.log('login_fail', { attempt:attempts }, currentKey);
    showError((FAIL_LINES[attempts-1] || FAIL_LINES[2])(attempts));

    if(attempts >= 3){
      showError('Account tijdelijk geblokkeerd. Neem contact op met IT-beheer. (Grapje. Probeer gewoon opnieuw.)');
      GGZ.log('account_locked', {}, currentKey);
      loginBtn.disabled = true;
      passwordInput.disabled = true;
      // gentle self-unlock — it's a goodbye card, not Fort Knox
      setTimeout(function(){
        attempts = 0;
        document.getElementById('attempts').textContent = '0';
        loginBtn.disabled = false;
        passwordInput.disabled = false;
        passwordInput.value = '';
        hideMsgs();
        passwordInput.focus();
      }, 4000);
    }
  }
});
passwordInput.addEventListener('keydown', function(e){
  if(e.key === 'Enter') loginBtn.click();
});

backBtn.addEventListener('click', function(){
  step2.classList.add('is-hidden');
  step1.classList.remove('is-hidden');
  passwordInput.value = '';
  attempts = 0;
  document.getElementById('attempts').textContent = '0';
  hideMsgs();
  currentUser = currentKey = null;
  GGZ.setAccent(GGZ.DEFAULT_ACCENT);
  loginBtn.disabled = passwordInput.disabled = false;
  loginBtn.textContent = 'Inloggen';
  document.getElementById('title').textContent = 'Welkom terug';
  document.getElementById('subtitle').textContent = 'Log in om verder te gaan';
  usernameInput.focus();
});

/* ── easter eggs ── */
GGZ.initKonami(function(){
  GGZ.confetti();
  GGZ.toast('🕹️ Afdeling 0 ontgrendeld — je hebt goede ogen.');
  GGZ.log('easter_egg', { egg:'konami' });
});

var mark = document.getElementById('mark');
GGZ.initClickStreak(mark, 5, function(){
  GGZ.toast('☕ Gebouwd met te veel koffie door 56 · @56isk');
  GGZ.log('easter_egg', { egg:'logo5' });
});
mark.addEventListener('keydown', function(e){
  if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); mark.click(); }
});

console.log('%cPatiëntportaal', 'color:#d8674a;font:600 22px Georgia,serif');
console.log('%cJe zoekt de broncode? Braaf. Er zit hier niks engs — alleen een afscheid.\nGemaakt door 56 · instagram @56isk · github.com/56snty', 'color:#828d94;font:13px monospace');
console.log('%cPsst: ↑↑↓↓←→←→ B A', 'color:#d8674a;font:12px monospace');

GGZ.init({ page:'gate', accent:false });
usernameInput.focus();
</script>
</body>
</html>
